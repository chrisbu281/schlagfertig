<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einstellungen – Schlagfertig</title>
<style>
:root {
  --bg:      #0d0d14;
  --surface: #16161f;
  --border:  rgba(255,255,255,.09);
  --fg:      #e8e8f0;
  --muted:   rgba(232,232,240,.45);
  --accent:  #E24B4A;
  --green:   #22c55e;
  --yellow:  #f59e0b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body {
  background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.6;
  padding: 0 16px;
  min-height: 100vh;
}
.page { max-width: 560px; margin: 0 auto; padding: 40px 0 80px }

.logo { font-size: 18px; font-weight: 900; letter-spacing: -.4px; margin-bottom: 4px }
.logo span { color: var(--accent) }
.back { color: var(--muted); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 32px }
.back:hover { color: var(--fg) }

h2 { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; margin-top: 32px }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.info-row { display: flex; justify-content: space-between; align-items: center; gap: 16px }
.info-label { color: var(--muted); font-size: 13px }
.info-val { font-size: 13px; font-family: 'Courier New', monospace; text-align: right }

.divider { border: none; border-top: 1px solid var(--border) }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 8px; padding: 10px 20px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97) }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none }
.btn-primary { background: var(--accent); color: #fff }
.btn-secondary { background: rgba(255,255,255,.08); color: var(--fg) }
.btn-green { background: var(--green); color: #000 }
.btn-danger { background: rgba(226,75,74,.15); color: var(--accent); border: 1px solid rgba(226,75,74,.3) }

.update-status {
  border-radius: 8px; padding: 12px 14px;
  font-size: 13px; line-height: 1.5;
  display: none;
}
.update-status.aktuell  { background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.3);  color: var(--green) }
.update-status.verfuegbar { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: var(--yellow) }
.update-status.fehler   { background: rgba(226,75,74,.1);  border: 1px solid rgba(226,75,74,.3);  color: var(--accent) }
.update-status.laedt    { background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted) }

.spinner {
  width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.2);
  border-top-color: currentColor; border-radius: 50%;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg) } }

.progress-bar {
  height: 3px; background: rgba(255,255,255,.08);
  border-radius: 2px; overflow: hidden; display: none;
}
.progress-bar-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px;
  animation: progress 20s linear forwards;
}
@keyframes progress { from { width: 0 } to { width: 100% } }

.version-tag {
  font-family: 'Courier New', monospace; font-size: 12px;
  background: rgba(255,255,255,.07); border-radius: 4px; padding: 1px 6px;
}
</style>
</head>
<body>
<div class="page">
  <div class="logo">SCHLAG<span>FERTIG</span></div>
  <a href="/moderator" class="back">← Zurück zum Moderator</a>

  <!-- System-Info -->
  <h2>System</h2>
  <div class="card" id="info-card">
    <div class="info-row">
      <span class="info-label">IP-Adresse</span>
      <span class="info-val" id="info-ip">…</span>
    </div>
    <hr class="divider">
    <div class="info-row">
      <span class="info-label">WLAN</span>
      <span class="info-val" id="info-wlan">…</span>
    </div>
    <hr class="divider">
    <div class="info-row">
      <span class="info-label">Temperatur</span>
      <span class="info-val" id="info-temp">…</span>
    </div>
    <hr class="divider">
    <div class="info-row">
      <span class="info-label">Speicher</span>
      <span class="info-val" id="info-speicher">…</span>
    </div>
    <hr class="divider">
    <div class="info-row">
      <span class="info-label">Version</span>
      <span class="info-val" id="info-version">…</span>
    </div>
  </div>

  <!-- Update -->
  <h2>Software-Update</h2>
  <div class="card">
    <div id="update-status" class="update-status"></div>
    <div class="progress-bar" id="update-progress"><div class="progress-bar-fill"></div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap">
      <button class="btn btn-secondary" id="btn-check" onclick="checkUpdate()">
        Update prüfen
      </button>
      <button class="btn btn-green" id="btn-install" onclick="installUpdate()" style="display:none">
        Jetzt installieren
      </button>
    </div>
  </div>

  <!-- Neustart / Herunterfahren -->
  <h2>Gerät</h2>
  <div class="card">
    <div style="display:flex; gap:10px; flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="doReboot()">Neustart</button>
      <button class="btn btn-danger" onclick="doShutdown()">Herunterfahren</button>
    </div>
  </div>
</div>

<script>
async function ladeInfo() {
  try {
    const r = await fetch('/api/system/info');
    const d = await r.json();
    document.getElementById('info-ip').textContent       = d.ip || '–';
    document.getElementById('info-wlan').textContent     = d.wlan || '–';
    document.getElementById('info-temp').textContent     = d.temperatur || '–';
    document.getElementById('info-speicher').textContent = d.speicher || '–';
    const ver = d.version || '–';
    const hash = ver.split(' ')[0];
    const msg  = ver.split(' ').slice(1).join(' ');
    document.getElementById('info-version').innerHTML =
      `<span class="version-tag">${hash}</span>${msg ? ' ' + msg : ''}`;
  } catch(e) {
    console.error(e);
  }
}

function setUpdateStatus(typ, text) {
  const el = document.getElementById('update-status');
  el.className = 'update-status ' + typ;
  el.style.display = 'block';
  el.innerHTML = text;
}

let _neueVersion = null;

async function checkUpdate() {
  const btn = document.getElementById('btn-check');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Prüfe…';
  document.getElementById('btn-install').style.display = 'none';
  setUpdateStatus('laedt', '<span class="spinner"></span> Verbinde mit GitHub…');

  try {
    const r = await fetch('/api/system/update-check');
    const d = await r.json();
    btn.disabled = false;
    btn.textContent = 'Update prüfen';

    if (d.error) {
      setUpdateStatus('fehler', '✗ Fehler: ' + d.error);
      return;
    }
    if (d.update_verfuegbar) {
      _neueVersion = d.neu;
      setUpdateStatus('verfuegbar',
        `⬆ Neue Version verfügbar<br>
         <span style="opacity:.7;font-size:12px">
           <span class="version-tag">${d.aktuell}</span> → <span class="version-tag">${d.neu}</span>
           ${d.nachricht ? ' · ' + d.nachricht : ''}
         </span>`
      );
      document.getElementById('btn-install').style.display = 'inline-flex';
    } else {
      setUpdateStatus('aktuell', '✓ Bereits aktuell · Version <span class="version-tag">' + d.aktuell + '</span>');
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Update prüfen';
    setUpdateStatus('fehler', '✗ Keine Verbindung – WLAN prüfen');
  }
}

async function installUpdate() {
  const btnI = document.getElementById('btn-install');
  const btnC = document.getElementById('btn-check');
  btnI.disabled = true;
  btnC.disabled = true;
  setUpdateStatus('laedt',
    '<span class="spinner"></span> Update wird installiert – bitte warten…'
  );
  const bar = document.getElementById('update-progress');
  bar.style.display = 'block';
  bar.querySelector('.progress-bar-fill').style.animation = 'none';
  void bar.querySelector('.progress-bar-fill').offsetHeight;
  bar.querySelector('.progress-bar-fill').style.animation = '';

  try {
    await fetch('/api/system/update', { method: 'POST' });
    setUpdateStatus('laedt',
      '<span class="spinner"></span> Update fertig – Pi startet neu (ca. 15 Sek.)…'
    );
    setTimeout(() => location.reload(), 20000);
  } catch(e) {
    setUpdateStatus('fehler', '✗ Fehler beim Update-Start');
    btnI.disabled = false;
    btnC.disabled = false;
    bar.style.display = 'none';
  }
}

async function doReboot() {
  if (!confirm('Pi jetzt neu starten?')) return;
  await fetch('/api/system/reboot', { method: 'POST' });
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;color:#E24B4A">Pi startet neu…</div>';
}

async function doShutdown() {
  if (!confirm('Pi wirklich herunterfahren?')) return;
  await fetch('/api/system/shutdown', { method: 'POST' });
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;color:#E24B4A">Pi fährt herunter…</div>';
}

ladeInfo();
</script>
</body>
</html>
