<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Spiel 4 – Beamer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; }

  .scene {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a14 70%);
    animation: bgpulse 4s ease-in-out infinite;
  }

  @keyframes bgpulse {
    0%, 100% { background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a14 70%); }
    50%       { background: radial-gradient(ellipse at center, #1e2050 0%, #0a0a14 70%); }
  }

  .label {
    font-family: 'Arial Black', Impact, sans-serif;
    font-size: clamp(18px, 3vw, 36px);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #6366f1;
    opacity: .7;
  }

  .title {
    font-family: 'Arial Black', Impact, sans-serif;
    font-size: clamp(60px, 12vw, 160px);
    font-weight: 900;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 40px rgba(99,102,241,.8),
      0 0 80px rgba(99,102,241,.4),
      0 0 120px rgba(99,102,241,.2);
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 40px rgba(99,102,241,.8), 0 0 80px rgba(99,102,241,.4); }
    50%       { text-shadow: 0 0 60px rgba(139,92,246,1),  0 0 120px rgba(139,92,246,.6), 0 0 200px rgba(139,92,246,.3); }
  }

  .status {
    font-family: monospace;
    font-size: clamp(14px, 2vw, 22px);
    color: #6366f1;
    opacity: .6;
    letter-spacing: .1em;
  }

  .conn-dot {
    position: fixed; top: 20px; right: 20px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #374151;
    transition: background .3s;
  }
  .conn-dot.on { background: #6366f1; box-shadow: 0 0 8px #6366f1; }
</style>
</head>
<body>
<div class="conn-dot" id="conn"></div>

<div class="scene">
  <div class="label">Schlagfertig</div>
  <div class="title">Test&nbsp;4</div>
  <div class="status" id="status">Verbinde …</div>
</div>

<script src="/static/socket.io.min.js"></script>
<script>
  const socket = io('/testspiel', { transports: ['websocket'] });

  socket.on('connect',    () => {
    document.getElementById('conn').classList.add('on');
    document.getElementById('status').textContent = 'Bereit';
  });
  socket.on('disconnect', () => {
    document.getElementById('conn').classList.remove('on');
    document.getElementById('status').textContent = 'Verbindung unterbrochen';
  });
  socket.on('state', (s) => {
    document.getElementById('status').textContent =
      s.phase === 'aktiv' ? 'Spiel läuft' : 'Bereit';
  });
  socket.on('beamer_reload', () => window.location.reload());
</script>
</body>
</html>
