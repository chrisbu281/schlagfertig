<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Silvester-Quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#46178f;color:#fff}
#app{min-height:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:6px 0 0}
.center{margin:auto 0;text-align:center;font-size:22px;line-height:1.4}
input{font-size:22px;padding:14px;border-radius:10px;border:0;width:100%}
button{font:inherit;border:0;border-radius:12px;color:#fff;cursor:pointer}
.go{background:#26890c;font-size:22px;font-weight:700;padding:16px}
.bar{display:flex;justify-content:space-between;font-size:15px;opacity:.9}
.timer{font-weight:800;font-size:18px}
.q{font-size:19px;font-weight:700;line-height:1.3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.a{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:17px;font-weight:700;padding:10px}
.a .s{font-size:30px}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.box{border-radius:16px;padding:22px;text-align:center}
.box .t{font-size:32px;font-weight:800}
.ok{background:#26890c}.no{background:#e21b3c}.none{background:#555}
.small{font-size:16px;opacity:.85}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:14px;text-align:center;font-size:20px}
.err{background:#e21b3c;padding:10px;border-radius:10px}
#conn{position:fixed;bottom:6px;right:8px;font-size:12px;opacity:.7}
</style>
</head>
<body>
<div id="app"></div>
<div id="conn"></div>
<script>
const app = document.getElementById('app');
const conn = document.getElementById('conn');
const SH = ['▲', '◆', '●', '■'];
let token = localStorage.getItem('silvesterQuizToken');
let lastKey = null, busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'};
  const r = await fetch(path, opt);
  return r.json();
}

function showJoin(msg) {
  lastKey = 'join';
  app.innerHTML = `<h1>🎆 Silvester-Quiz</h1>
    ${msg ? `<div class="err">${esc(msg)}</div>` : '<div>Wie heißt du?</div>'}
    <input id="n" maxlength="20" autocomplete="off" placeholder="Dein Name">
    <button class="go" id="j">Mitspielen</button>`;
  const n = document.getElementById('n');
  document.getElementById('j').onclick = join;
  n.onkeydown = e => { if (e.key === 'Enter') join(); };
}

async function join() {
  const name = document.getElementById('n').value.trim();
  if (!name) return;
  const r = await api('/api/join', {name});
  if (r.error) return showJoin(r.error);
  token = r.token;
  localStorage.setItem('silvesterQuizToken', token);
  lastKey = null;
  poll();
}

async function answer(i) {
  if (busy) return;
  busy = true;
  try { await api('/api/answer', {token, answer:i}); lastKey = null; await poll(); }
  finally { busy = false; }
}

function render(s) {
  if (s.phase === 'nojoin') { if (lastKey !== 'join') showJoin(); return; }
  const key = JSON.stringify([s.phase, s.q && s.q.nr, s.myAnswer, s.score, s.rank, s.players]);
  const t = document.getElementById('timer');
  if (t && s.remaining != null) t.textContent = Math.ceil(s.remaining) + ' s';
  if (key === lastKey) return;
  lastKey = key;

  const me = `<div class="bar"><span>👤 ${esc(s.name)}</span><span>${s.score} Punkte</span></div>`;

  if (s.phase === 'lobby') {
    app.innerHTML = `${me}<div class="center">✅ Du bist dabei!<br><br>Schau auf den Bildschirm –<br>gleich geht's los.<div class="small" style="margin-top:14px">${s.players} Spieler angemeldet</div><div class="small" style="margin-top:28px">📱 Tipp: Stell die automatische Bildschirm-Sperre fürs Quiz ab. Wenn das Handy doch ausgeht: einfach entsperren, du bist sofort wieder drin.</div></div>`;
  } else if (s.phase === 'question') {
    if (s.myAnswer === null) {
      app.innerHTML = `${me}
        <div class="bar"><span>Frage ${s.q.nr} / ${s.q.total}</span><span class="timer" id="timer">${s.remaining != null ? Math.ceil(s.remaining) + ' s' : ''}</span></div>
        <div class="q">${esc(s.q.text)}</div>
        <div class="grid">${s.q.answers.map((a, i) =>
          `<button class="a c${i}" data-i="${i}"><span class="s">${SH[i]}</span>${esc(a)}</button>`).join('')}</div>`;
      app.querySelectorAll('.a').forEach(b => b.onclick = () => answer(+b.dataset.i));
    } else {
      app.innerHTML = `${me}<div class="center"><div class="box c${s.myAnswer}"><div class="t">${SH[s.myAnswer]}</div>${esc(s.q.answers[s.myAnswer])}</div><br>Antwort gespeichert.<br>Warte auf die anderen …</div>`;
    }
  } else if (s.phase === 'reveal') {
    let box;
    if (s.myAnswer === null) box = `<div class="box none"><div class="t">⏰ Zu spät</div>Keine Antwort</div>`;
    else if (s.myAnswer === s.correct) box = `<div class="box ok"><div class="t">✔ Richtig!</div>+${s.gained} Punkte</div>`;
    else box = `<div class="box no"><div class="t">✘ Leider falsch</div></div>`;
    app.innerHTML = `${me}<div class="center">${box}<div class="small" style="margin-top:16px">Richtig war:</div><div style="font-weight:700">${SH[s.correct]} ${esc(s.q.answers[s.correct])}</div></div>
      <div class="stat">Platz ${s.rank} von ${s.players}</div>`;
  } else if (s.phase === 'leaderboard') {
    app.innerHTML = `${me}<div class="center"><div class="stat">Du bist auf <b>Platz ${s.rank}</b> von ${s.players}<br>${s.score} Punkte</div><br>Gleich kommt die nächste Frage …</div>`;
  } else if (s.phase === 'final') {
    const medal = s.rank === 1 ? '🥇' : s.rank === 2 ? '🥈' : s.rank === 3 ? '🥉' : '🎆';
    app.innerHTML = `${me}<div class="center"><div style="font-size:64px">${medal}</div><b>Spiel vorbei!</b><br><br>Platz ${s.rank} von ${s.players}<br>${s.score} Punkte</div>`;
  }
}

async function poll() {
  if (!token) { if (lastKey !== 'join') showJoin(); return; }
  try {
    const s = await api('/api/state?token=' + encodeURIComponent(token));
    conn.textContent = '';
    if (s.phase === 'nojoin') { token = null; localStorage.removeItem('silvesterQuizToken'); }
    render(s);
  } catch (e) {
    conn.textContent = 'Verbindung wird gesucht …';
  }
}

poll();
setInterval(poll, 700);
</script>
</body>
</html>
